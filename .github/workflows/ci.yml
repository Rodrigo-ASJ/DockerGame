name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DockerGame
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Install dependencies
        run: |
          export PATH="$(corepack whereis pnpm | awk '{print $1}' | xargs dirname):$PATH"
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          export PATH="$(corepack whereis pnpm | awk '{print $1}' | xargs dirname):$PATH"
          pnpm lint

      - name: Typecheck
        run: |
          export PATH="$(corepack whereis pnpm | awk '{print $1}' | xargs dirname):$PATH"
          pnpm typecheck

      - name: Test
        run: |
          export PATH="$(corepack whereis pnpm | awk '{print $1}' | xargs dirname):$PATH"
          pnpm test

      - name: Build
        run: |
          export PATH="$(corepack whereis pnpm | awk '{print $1}' | xargs dirname):$PATH"
          pnpm build